appId: com.scope.desktop
productName: Scope
directories:
  output: release
files:
  - dist/**
  - package.json
afterSign: scripts/notarize.mjs
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Scope uses your microphone when you explicitly start meeting capture.
    NSScreenCaptureUsageDescription: Scope uses screen and system audio capture when you explicitly start meeting capture.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - zip
    - dmg
  artifactName: "Scope-${version}.${ext}"
dmg:
  sign: true
